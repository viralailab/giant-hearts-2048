<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #2b1055 0%, #7597de 55%, #ff9a9e 130%);
    color:#fff; overflow:hidden; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center;
    touch-action:none;
  }
  #app { width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; padding:8px 10px 10px; gap:8px; }
  #hud { display:flex; align-items:stretch; gap:8px; }
  .card {
    background: rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
    border-radius:14px; padding:6px 10px; backdrop-filter: blur(4px);
  }
  #titleCard { flex:1.2; }
  #titleCard .name { font-size:19px; font-weight:800; line-height:1.15; text-shadow:0 2px 6px rgba(0,0,0,.25); }
  #mode { font-size:11px; font-weight:700; opacity:.9; letter-spacing:.06em; text-transform:uppercase; }
  .scoreCard { flex:1; text-align:center; }
  .label { font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; font-weight:700; }

  .btns { display:flex; flex-direction:column; gap:6px; }
  button {
    font-family:inherit; font-weight:800; color:#fff; cursor:pointer;
    background: rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
    border-radius:12px; padding:7px 10px; font-size:14px; line-height:1;
  }
  button:active { transform:scale(.94); }
  .rowBtns { display:flex; gap:8px; }
  .rowBtns button { flex:1; padding:10px 4px; font-size:13px; }
  #btnUndo { background:#b565d8; border-color:#dda6f2; }
  #btnDaily { background:#ff5d8f; border-color:#ffb3c9; }
  #boardWrap {
    position:relative; width:100%; max-width:440px; margin:0 auto; aspect-ratio:1/1;
    background: rgba(30,12,60,.45); border:2px solid rgba(255,255,255,.28);
    border-radius:18px; box-shadow:0 14px 34px rgba(0,0,0,.35);
  }
  .cell {
    position:absolute; border-radius:12px; background:rgba(255,255,255,.10);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.22);
  }
  .tile {
    position:absolute; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-weight:800; will-change:transform;
    transition: transform .13s ease-in-out;
    box-shadow: inset 0 -5px 9px rgba(0,0,0,.16), inset 0 4px 6px rgba(255,255,255,.35), 0 3px 8px rgba(0,0,0,.22);
  }
  .tile.spawn { animation: spawnIn .18s ease .02s backwards; }
  .tile.pop { animation: popIn .2s ease; }
  @keyframes spawnIn { from { scale:.3; opacity:0; } to { scale:1; opacity:1; } }
  @keyframes popIn { 0% { scale:1; } 45% { scale:1.22; } 100% { scale:1; } }
  #pad { display:grid; grid-template-columns:repeat(3, 52px); grid-template-rows:repeat(2, 40px); gap:5px; justify-content:center; }
  #pad button { font-size:17px; padding:0; border-radius:10px; }
  #pad .up { grid-column:2; } #pad .left { grid-column:1; grid-row:2; }
  #pad .down { grid-column:2; grid-row:2; } #pad .right { grid-column:3; grid-row:2; }
  #promo { display:flex; flex-wrap:wrap; gap:6px; }
  #promo a {
    flex:1 1 30%; text-align:center; text-decoration:none; color:#fff; font-weight:800; font-size:12px;
    background: rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3);
    border-radius:12px; padding:7px 4px; white-space:nowrap;
  }
  #modal {
    position:fixed; inset:0; background:rgba(20,8,40,.66); display:none;
    align-items:center; justify-content:center; z-index:10; padding:20px;
  }
  #modal.show { display:flex; }
  #modalBox {
    background: linear-gradient(165deg,#3b1d6e,#6a3fb5); border:2px solid rgba(255,255,255,.35);
    border-radius:22px; padding:26px 24px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  #modalBox h1 { font-size:28px; margin-bottom:4px; }
  #modalBox .heart { font-size:40px; }
  #modalBox p { opacity:.9; font-weight:700; margin:4px 0 14px; }
  #modalBox .row { display:flex; gap:8px; margin-top:8px; }
  #modalBox button { flex:1; padding:12px; font-size:15px; border-radius:14px; }
  #btnPrimary { background:#ff5d8f; border-color:#ffb3c9; }
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.8); color:#fff; font-weight:700; font-size:14px;
    padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:20;
    max-width:92vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #hint { text-align:center; font-size:11.5px; opacity:.85; font-weight:600; }
  #spacer { flex:1; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="card" id="titleCard">
      <div class="name">💛 Giant Hearts 2048</div>
      <div id="mode">Classic</div>
    </div>
    <div class="card scoreCard">
      <div class="label">Score</div>
      <div class="scoreNum" id="score">0</div>
    </div>
    <div class="card scoreCard">
      <div class="label">Best</div>
      <div class="scoreNum" id="best">0</div>
    </div>
    <div class="btns">
      <button id="btnMute" title="Sound on/off">🔊</button>

  <div id="boardWrap"></div>

    <button class="up" data-dir="up">▲</button>

    <a href="https://t.me/GiantHeartsMergeBot/game" target="_blank" rel="noopener">🐶 Merge</a>
    <a href="https://t.me/GiantHeartsBlocksBot/game" target="_blank" rel="noopener">🧩 Blocks</a>

    <a href="https://t.me/CharkhVazheBot/game" target="_blank" rel="noopener">🔤 چرخ واژه</a>

  </div>
  <div id="hint">Swipe, drag or use the arrows · join two equal tiles to reach 2048! 💛</div>
</div>

<div id="modal">
  <div id="modalBox">
    <div class="heart" id="modalHeart">💛</div>
    <h1 id="modalTitle">You Win!</h1>
    <p id="modalText">Score: 0</p>
    <div class="row">
      <button id="btnPrimary">▶ Keep Going</button>
      <button id="btnShare">📤 Share</button>

    <div class="row">
      <button id="btnModalNew">🆕 New Game</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   GIANT HEARTS 2048 — an original sliding-tile puzzle.
   Slide the tiles; two equal tiles merge into one bigger
   tile. Reach 2048 — then keep going as far as you can!
   ========================================================= */

/* ---------- Telegram Mini App (guarded) ---------- */
try {
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor("#2b1055");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#2b1055");
  }
} catch (e) { /* not in Telegram — fine */ }

/* ---------- AdsGram (guarded; game works fully without ads) ---------- */
const ADS_INT_ID = "int-XXXXX";   // TODO: replace with this game's Interstitial Block ID
const ADS_REW_ID = "XXXXX";       // TODO: replace with this game's Rewarded Block ID
const _adsCache = {};
let lastInterstitial = 0;
function adsCtl(blockId) {
  if (_adsCache[blockId]) return _adsCache[blockId];
  try { if (window.Adsgram) _adsCache[blockId] = window.Adsgram.init({ blockId }); } catch (e) {}
  return _adsCache[blockId] || null;
}
function showInterstitial() {
  const now = Date.now();
  if (now - lastInterstitial < 90000) return Promise.resolve(false);
  const ctl = adsCtl(ADS_INT_ID);
  if (!ctl) return Promise.resolve(false);
  lastInterstitial = now;
  return ctl.show().then(() => true).catch(() => false);
}
function showRewarded() {
  const ctl = adsCtl(ADS_REW_ID);
  if (!ctl) return Promise.resolve(false);
  return ctl.show().then(() => true).catch(() => false);
}

/* === CORE LOGIC START === (pure functions — unit-tested) */
const SIZE = 4;
function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }
function cloneGrid(g) { return g.map(r => r.slice()); }
function gridsEqual(a, b) {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (a[r][c] !== b[r][c]) return false;
  return true;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Slide one line toward index 0. Each tile merges at most once per move.
   Returns cells: [{v, srcs:[source indexes], merged}], gained score, created2048. */
function processLine(vals) {
  const entries = [];
  vals.forEach((v, i) => { if (v) entries.push({ v, idx: i }); });
  const cells = [];
  let gained = 0, created2048 = false, i = 0;
  while (i < entries.length) {
    if (i + 1 < entries.length && entries[i + 1].v === entries[i].v) {
      const nv = entries[i].v * 2;
      gained += nv; if (nv === 2048) created2048 = true;
      cells.push({ v: nv, srcs: [entries[i].idx, entries[i + 1].idx], merged: true });
      i += 2;
    } else {
      cells.push({ v: entries[i].v, srcs: [entries[i].idx], merged: false });
      i += 1;
    }
  }
  while (cells.length < SIZE) cells.push({ v: 0, srcs: [], merged: false });
  return { cells, gained, created2048 };
}
/* Cell coordinates of line `li` in traversal order for a direction. */
function lineCoords(dir, li) {
  const coords = [];
  for (let k = 0; k < SIZE; k++) {
    if (dir === "left") coords.push([li, k]);
    else if (dir === "right") coords.push([li, SIZE - 1 - k]);
    else if (dir === "up") coords.push([k, li]);
    else coords.push([SIZE - 1 - k, li]); // down
  }
  return coords;
}
function moveValues(grid, dir) {
  const out = emptyGrid();
  let gained = 0, created2048 = false;
  const lines = [];
  for (let li = 0; li < SIZE; li++) {
    const coords = lineCoords(dir, li);
    const vals = coords.map(([r, c]) => grid[r][c]);
    const res = processLine(vals);
    gained += res.gained; created2048 = created2048 || res.created2048;
    res.cells.forEach((cell, j) => { const [r, c] = coords[j]; out[r][c] = cell.v; });
    lines.push({ coords, cells: res.cells });
  }
  return { grid: out, gained, created2048, moved: !gridsEqual(out, grid), lines };
}
function emptyCells(grid) {
  const e = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) e.push([r, c]);
  return e;
}
/* Spawn a 2 (90%) or 4 (10%) on a random empty cell. Consumes exactly 2 rng calls.
   Returns {grid, r, c, v} or null when the board is full. */
function spawnRandom(grid, rng) {
  const e = emptyCells(grid);
  if (!e.length) return null;
  const [r, c] = e[Math.floor(rng() * e.length)];
  const g = cloneGrid(grid);
  g[r][c] = rng() < 0.9 ? 2 : 4;
  return { grid: g, r, c, v: g[r][c] };
}
function movesAvailable(grid) {
  if (emptyCells(grid).length) return true;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
    if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
  }
  return false;
}
function hasValue(grid, v) {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] === v) return true;
  return false;
}
function makeSnapshot(grid, score, extra) {
  return { grid: cloneGrid(grid), score, extra: extra || null };
}
/* Daily challenge: deterministic seed + starting board from a "YYYY-MM-DD" string. */
function dailySeed(dateStr) {
  let h = 2166136261;
  for (let i = 0; i < dateStr.length; i++) { h ^= dateStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dailyStartGrid(dateStr) {
  const rng = mulberry32(dailySeed(dateStr));
  let g = emptyGrid();
  g = spawnRandom(g, rng).grid;
  g = spawnRandom(g, rng).grid;
  return g;
}
/* === CORE LOGIC END === */

/* ---------- Audio (tiny WebAudio UI sounds) ---------- */
let muted = localStorage.getItem("gh2048_muted") === "1";
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function blip(freq, dur, vol, type) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfxSlide = () => blip(300, 0.06, 0.06, "sine");
const sfxMerge = () => { blip(520, 0.09, 0.12, "sine"); setTimeout(() => blip(700, 0.1, 0.1, "sine"), 45); };
const sfxWin   = () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => blip(f, 0.2, 0.14), i * 95)); };
const sfxOver  = () => { [440, 349, 262].forEach((f, i) => setTimeout(() => blip(f, 0.2, 0.11), i * 130)); };

/* ---------- Tile visuals ---------- */
const TILE_STYLE = {
  2:    { bg: "#fff3d6", fg: "#8a6d3b" },
  4:    { bg: "#ffe3a3", fg: "#8a6d3b" },
  8:    { bg: "#ffb35c", fg: "#ffffff" },
  16:   { bg: "#ff8a5c", fg: "#ffffff" },
  32:   { bg: "#ff6b6b", fg: "#ffffff" },
  64:   { bg: "#f43f63", fg: "#ffffff" },
  128:  { bg: "#ffd166", fg: "#7a5410" },
  256:  { bg: "#f4d35e", fg: "#7a5410" },
  512:  { bg: "#eec643", fg: "#ffffff" },
  1024: { bg: "#e0a81c", fg: "#ffffff" },
  2048: { bg: "#ff5d8f", fg: "#ffffff" },
};
function tileStyle(v) {
  return TILE_STYLE[v] || { bg: "#c9184a", fg: "#ffffff" }; // super tiles (4096+)
}

/* ---------- State ---------- */
const elWrap = document.getElementById("boardWrap");
const elScore = document.getElementById("score");
const elBest = document.getElementById("best");
const elMode = document.getElementById("mode");
const elModal = document.getElementById("modal");
const elToast = document.getElementById("toast");

let tiles = new Map();      // id -> {id, v, r, c, el}
let gridIds = emptyGrid();  // cell -> tile id (0 = empty)
let nextId = 1;
let score = 0;
let best = +(localStorage.getItem("gh2048_best") || 0);
let wonYet = false;         // 2048 reached in the current game
let over = false;
let animating = false;
let snapshot = null;        // one-step undo: {grid, score, extra}
let mode = "normal";        // "normal" | "daily"
let dailyRng = null, dailySpawns = 0;
let toastTimer = 0;
let cellPx = 80, gapPx = 10, padPx = 10;

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function valueGrid() {
  const g = emptyGrid();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const id = gridIds[r][c];
    g[r][c] = id ? tiles.get(id).v : 0;
  }
  return g;
}

/* ---------- Board rendering ---------- */
function buildBackground() {
  elWrap.querySelectorAll(".cell").forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const d = document.createElement("div");
    d.className = "cell";
    place(d, r, c);
    elWrap.appendChild(d);
  }
}
function place(el, r, c) {
  el.style.width = cellPx + "px";
  el.style.height = cellPx + "px";
  el.style.transform = "translate(" + (padPx + c * (cellPx + gapPx)) + "px," + (padPx + r * (cellPx + gapPx)) + "px)";
}
function layout() {
  const W = elWrap.clientWidth || 440;
  padPx = 10; gapPx = 10;
  cellPx = (W - 2 * padPx - (SIZE - 1) * gapPx) / SIZE;
  buildBackground();
  tiles.forEach(t => { place(t.el, t.r, t.c); paintTile(t); });
}
function paintTile(t) {
  const s = tileStyle(t.v);
  t.el.style.background = s.bg;
  t.el.style.color = s.fg;
  t.el.style.fontSize = Math.max(17, cellPx * (t.v >= 1024 ? 0.34 : t.v >= 128 ? 0.4 : 0.46)) + "px";
  t.el.style.boxShadow = t.v >= 2048
    ? "0 0 22px rgba(255,93,143,.85), inset 0 -5px 9px rgba(0,0,0,.16), inset 0 4px 6px rgba(255,255,255,.4)"
    : "";
  t.el.textContent = t.v;
}
function addTile(v, r, c, animate) {
  const el = document.createElement("div");
  el.className = "tile" + (animate ? " spawn" : "");
  elWrap.appendChild(el);
  const t = { id: nextId++, v, r, c, el };
  tiles.set(t.id, t);
  gridIds[r][c] = t.id;
  place(el, r, c);
  paintTile(t);
  return t;
}
function clearTiles() {
  tiles.forEach(t => t.el.remove());
  tiles = new Map();
  gridIds = emptyGrid();
}
function setBoardFromValues(grid) {
  clearTiles();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
    if (grid[r][c]) addTile(grid[r][c], r, c, false);
}
function renderHud() {
  elScore.textContent = score;
  elBest.textContent = best;
  elMode.textContent = mode === "daily" ? "📅 Daily · " + todayStr() : "Classic";
  document.getElementById("btnDaily").textContent =
    mode === "daily" ? "🎲 Back to Classic" : "📅 Daily Challenge";
}

/* ---------- Persistence ---------- */
function persist() {
  if (score > best) { best = score; localStorage.setItem("gh2048_best", best); }
  if (mode === "normal") {
    localStorage.setItem("gh2048_normal", JSON.stringify({ grid: valueGrid(), score, wonYet }));
  } else {
    localStorage.setItem("gh2048_daily", JSON.stringify({
      date: todayStr(), grid: valueGrid(), score, wonYet,
      spawns: dailySpawns, done: over,
    }));
  }
  renderHud();
}
function loadDaily() {
  try {
    const d = JSON.parse(localStorage.getItem("gh2048_daily") || "null");
    return d && d.date === todayStr() ? d : null;
  } catch (e) { return null; }
}

/* ---------- Game flow ---------- */
function newGame() {
  mode = "normal";
  score = 0; wonYet = false; over = false; snapshot = null;
  const g = emptyGrid();
  const rng = Math.random;
  const s1 = spawnRandom(g, rng), s2 = spawnRandom(s1.grid, rng);
  setBoardFromValues(s2.grid);
  elModal.classList.remove("show");
  persist();
}
function startDaily() {
  const saved = loadDaily();
  mode = "daily";
  score = saved ? saved.score : 0;
  wonYet = saved ? !!saved.wonYet : false;
  over = saved ? !!saved.done : false;
  snapshot = null;
  dailySpawns = saved ? saved.spawns : 2;
  dailyRng = mulberry32(dailySeed(todayStr()));
  for (let i = 0; i < dailySpawns * 2; i++) dailyRng(); // replay consumed rng calls
  setBoardFromValues(saved ? saved.grid : dailyStartGrid(todayStr()));
  elModal.classList.remove("show");
  persist();
  if (over) toast("Today's Daily is done — score " + score + " 🏆");
  else if (!saved) toast("📅 Daily Challenge — one board for everyone today!");
}
function backToNormal() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem("gh2048_normal") || "null"); } catch (e) { return null; } })();
  mode = "normal";
  if (saved && saved.grid) {
    score = saved.score || 0; wonYet = !!saved.wonYet; over = !movesAvailable(saved.grid);
    snapshot = null;
    setBoardFromValues(saved.grid);
    elModal.classList.remove("show");
    persist();
  } else newGame();
}
function spawnNext() {
  const g = valueGrid();
  const res = mode === "daily" ? spawnRandom(g, dailyRng) : spawnRandom(g, Math.random);
  if (!res) return;
  if (mode === "daily") dailySpawns++;
  addTile(res.v, res.r, res.c, true);
}
function doMove(dir) {
  if (animating || over) return;
  if (elModal.classList.contains("show")) return;
  const before = valueGrid();
  const res = moveValues(before, dir);
  if (!res.moved) return; // invalid move: no spawn, no snapshot, no score change
  audio();
  snapshot = makeSnapshot(before, score, mode === "daily" ? dailySpawns : null);
  score += res.gained;
  animating = true;
  if (res.gained) sfxMerge(); else sfxSlide();

  // Animate: move every source tile to its output cell.
  const newIds = emptyGrid();
  const dying = [], popping = [];
  res.lines.forEach(({ coords, cells }) => {
    cells.forEach((cell, j) => {
      if (!cell.srcs.length) return;
      const [tr, tc] = coords[j];
      const srcTiles = cell.srcs.map(si => {
        const [sr, sc] = coords[si];
        return tiles.get(gridIds[sr][sc]);
      }).filter(Boolean);
      if (!srcTiles.length) return;
      const survivor = srcTiles[0];
      survivor.r = tr; survivor.c = tc;
      survivor.pendingV = cell.v;
      newIds[tr][tc] = survivor.id;
      survivor.el.style.zIndex = 3;
      place(survivor.el, tr, tc);
      if (cell.merged) popping.push(survivor);
      for (let k = 1; k < srcTiles.length; k++) {
        const d = srcTiles[k];
        d.r = tr; d.c = tc; d.el.style.zIndex = 2;
        place(d.el, tr, tc);
        dying.push(d);
      }
    });
  });
  gridIds = newIds;

  setTimeout(() => {
    dying.forEach(d => { d.el.remove(); tiles.delete(d.id); });
    popping.forEach(t => {
      t.el.classList.remove("pop"); void t.el.offsetWidth; t.el.classList.add("pop");
    });
    tiles.forEach(t => { if (t.pendingV) { t.v = t.pendingV; t.pendingV = 0; paintTile(t); } t.el.style.zIndex = ""; });
    spawnNext();
    animating = false;
    persist();
    if (res.created2048 && !wonYet) { wonYet = true; persist(); winGame(); return; }
    if (!movesAvailable(valueGrid())) gameOver();
  }, 145);
}
function winGame() {
  sfxWin();
  showModal("💛", "You made 2048!", "Score: " + score + (mode === "daily" ? " · Daily Challenge" : "") + " — keep going for an even bigger tile?", "▶ Keep Going", false);
}
function gameOver() {
  over = true;
  sfxOver();
  persist();
  const title = mode === "daily" ? "Daily Complete!" : "Game Over";
  const text = "Final score: " + score + " · Best: " + best + (mode === "daily" ? " · Come back tomorrow for a new board 📅" : "");
  const show = () => showModal("💔", title, text, mode === "daily" ? "🎲 Play Classic" : "🆕 New Game", true);
  showInterstitial().then(show);
  setTimeout(() => { if (!elModal.classList.contains("show")) show(); }, 6000);
}
function showModal(heart, title, text, primaryLabel, primaryIsNew) {
  document.getElementById("modalHeart").textContent = heart;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalText").textContent = text;
  const bp = document.getElementById("btnPrimary");
  bp.textContent = primaryLabel;
  bp.dataset.action = primaryIsNew ? "new" : "continue";
  document.getElementById("btnModalNew").style.display = primaryIsNew ? "none" : "";
  elModal.classList.add("show");
}
function undo() {
  if (animating) return;
  if (!snapshot) { toast("Nothing to undo"); return; }
  showRewarded().then(ok => {
    if (!ok) { toast("Ad not available right now 🙏"); return; }
    score = snapshot.score;
    if (mode === "daily" && snapshot.extra !== null && snapshot.extra !== undefined) {
      dailySpawns = snapshot.extra;
      dailyRng = mulberry32(dailySeed(todayStr()));
      for (let i = 0; i < dailySpawns * 2; i++) dailyRng();
    }
    over = false;
    setBoardFromValues(snapshot.grid);
    snapshot = null; // consumed — one restore per ad view
    elModal.classList.remove("show");
    blip(420, 0.1, 0.1, "sine");
    toast("Undone ↩");
    persist();
  });
}
function toast(msg) {
  elToast.textContent = msg; elToast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => elToast.classList.remove("show"), 2200);
}
async function shareScore() {
  const text = "💛 I scored " + score + " in Giant Hearts 2048! Can you reach the 2048 tile? Play: Giant Hearts – Giant Animals of the World";
  if (navigator.share) { try { await navigator.share({ title: "Giant Hearts 2048", text }); return; } catch (e) { return; } }
  try { await navigator.clipboard.writeText(text); toast("Copied! 📋"); }
  catch (e) { toast(text); }
}

/* ---------- Input: swipe, drag, keys, buttons ---------- */
let pStart = null;
elWrap.addEventListener("touchstart", e => {
  pStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
elWrap.addEventListener("touchend", e => {
  if (!pStart) return;
  const dx = e.changedTouches[0].clientX - pStart.x;
  const dy = e.changedTouches[0].clientY - pStart.y;
  pStart = null;
  swipeDir(dx, dy);
});
elWrap.addEventListener("mousedown", e => { pStart = { x: e.clientX, y: e.clientY }; });
window.addEventListener("mouseup", e => {
  if (!pStart) return;
  const dx = e.clientX - pStart.x, dy = e.clientY - pStart.y;
  pStart = null;
  swipeDir(dx, dy);
});
function swipeDir(dx, dy) {
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 24) return;
  doMove(ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
}
window.addEventListener("keydown", e => {
  const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
  if (map[e.key]) { e.preventDefault(); doMove(map[e.key]); }
});
document.querySelectorAll("#pad button").forEach(b =>
  b.addEventListener("click", () => doMove(b.dataset.dir)));

/* ---------- Buttons ---------- */
const btnMute = document.getElementById("btnMute");
function paintMute() { btnMute.textContent = muted ? "🔇" : "🔊"; }
btnMute.addEventListener("click", () => { muted = !muted; localStorage.setItem("gh2048_muted", muted ? "1" : "0"); paintMute(); });
document.getElementById("btnNew").addEventListener("click", () => {
  if (mode === "daily") { toast("📅 Daily is one attempt — finish this board!"); return; }
  newGame();
});
document.getElementById("btnUndo").addEventListener("click", undo);
document.getElementById("btnDaily").addEventListener("click", () => {
  if (mode === "daily") { backToNormal(); return; }
  const saved = loadDaily();
  if (saved && saved.done) { toast("Today's Daily is done — score " + saved.score + " 🏆 New board tomorrow!"); return; }
  startDaily();
});
document.getElementById("btnShare").addEventListener("click", shareScore);
document.getElementById("btnPrimary").addEventListener("click", e => {
  elModal.classList.remove("show");
  if (e.target.dataset.action === "new") { if (mode === "daily") backToNormal(); else newGame(); }
});
document.getElementById("btnModalNew").addEventListener("click", () => {
  elModal.classList.remove("show");
  if (mode === "daily") backToNormal(); else newGame();
});

/* ---------- Boot ---------- */
window.addEventListener("resize", layout);
(function boot() {
  let started = false;
  try {
    const saved = JSON.parse(localStorage.getItem("gh2048_normal") || "null");
    if (saved && saved.grid && emptyCells(saved.grid).length < SIZE * SIZE) {
      score = saved.score || 0; wonYet = !!saved.wonYet;
      over = !movesAvailable(saved.grid);
      setBoardFromValues(saved.grid);
      started = true;
    }
  } catch (e) { /* fresh start below */ }
  if (!started) {
    const g = emptyGrid();
    const s1 = spawnRandom(g, Math.random), s2 = spawnRandom(s1.grid, Math.random);
    setBoardFromValues(s2.grid);
  }
  layout();
  renderHud();
  if (over) toast("That board is finished — tap 🆕 New for a fresh game");
})();
paintMute();
</script>
